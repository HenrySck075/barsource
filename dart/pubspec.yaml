name: barsource
description: A declarative, Flutter-inspired video editor library with a C++ backend.
version: 0.2.0

environment:
  sdk: ^3.12.1

dependencies:
  characters: ^1.4.1
  code_assets: ^1.0.0 
  #  path: ../patches/code_assets/
  collection: ^1.19.1
  console_bars: ^1.2.1
  ffi: ^2.1.0
  hooks: ^2.0.2
  logging: ^1.3.0
  meta: ^1.9.0
  vector_math: ^2.3.0
  vm_service: ^15.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.24.0
  ffigen: ^20.1.1

ffigen:
  output: 'lib/src/engine/bindings.dart'
  name: 'TennojiBindings'
  description: 'native renderer backend bindings'
  ffi-native:
    asset-id: 'package:barsource/rina'
  headers:
    entry-points:
      - '../native/include/tennoji/engine.h'
    include-directives:
      - '../native/include/tennoji/*.h'
  compiler-opts:
    - '-Dbool=_Bool'
    - '-Dtrue=1'
    - '-Dfalse=0'
  functions:
    leaf:
      include: 
         - "rina_.*" 
    symbol-address:
      include:
        - "rina_.*_destroy"
  macros:
    include:
      - 'TENNOJI_*'
  typedefs:
    exclude:
      - '_*' # shut the fuck up
  silence-enum-warning: true
  
  preamble: |
    // ignore_for_file: always_specify_types
    // ignore_for_file: camel_case_types
    // ignore_for_file: non_constant_identifier_names
